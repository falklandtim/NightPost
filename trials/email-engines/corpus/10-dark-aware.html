<!doctype html>
<html><head><meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<style>
  :root { color-scheme: light dark; }
  body { margin:0; background:#ffffff; color:#1b1b1f; font:15px/1.5 -apple-system,Helvetica,Arial,sans-serif; }
  .box { max-width:540px; margin:0 auto; padding:24px; }
  .panel { background:#f2f4f8; border-radius:10px; padding:16px 18px; }
  .logo-light { display:block; } .logo-dark { display:none; }
  a { color:#0b57d0; }
  @media (prefers-color-scheme: dark) {
    body { background:#15171c !important; color:#e6e8ee !important; }
    .panel { background:#22262f !important; }
    .logo-light { display:none !important; } .logo-dark { display:block !important; }
    a { color:#8ab4f8 !important; }
  }
</style></head>
<body>
<div class="box">
  <p class="logo-light" style="font-weight:700;font-size:18px;">☀︎ Example Bank (light logo)</p>
  <p class="logo-dark" style="font-weight:700;font-size:18px;">☾ Example Bank (dark logo)</p>
  <div class="panel">
    <p style="margin:0 0 8px;font-weight:600;">Your statement is ready</p>
    <p style="margin:0;">Your May statement for the account ending 0042 is ready to view in online banking. We'll never ask for your password by email.</p>
  </div>
  <p><a href="https://bank.example/statements">View statements</a></p>
  <p style="color:#888;font-size:12px;">This email follows your device's light or dark setting.</p>
</div>
</body></html>
