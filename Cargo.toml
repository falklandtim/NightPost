[workspace]
resolver = "2"
members = ["crates/owlpost-core", "crates/owlpost"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/timson/owlpost"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
log = "0.4"

[profile.release]
lto = "thin"
strip = true
