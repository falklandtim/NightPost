[package]
name = "nightpost"
description = "NightPost: a fast, native email client written in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nightpost-core = { path = "../nightpost-core" }
anyhow.workspace = true
chrono.workspace = true
crossbeam-channel.workspace = true
log.workspace = true
serde_json.workspace = true
directories = "6"
eframe = { version = "0.33", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland", "x11"] }
# "http" + "image": load signature images from the web.
egui_extras = { version = "0.33", features = ["http", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"] }
env_logger = "0.11"
rfd = "0.15"
resvg = { version = "0.45", default-features = false }
ureq = "2.12"
base64 = "0.22"

# macOS: HTML email and the composer are WKWebView, used directly
# (mac_web.rs). wry did this until 2026-11-17; its Linux half pulled the
# unmaintained GTK 3 crates into Cargo.lock.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSColor", "NSEvent", "NSGraphics", "NSMenu", "NSMenuItem", "NSResponder", "NSView", "NSWindow"] }
objc2-contacts = "0.3"
objc2-foundation = "0.3"
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std", "block2", "objc2-app-kit", "WKFrameInfo", "WKNavigation", "WKNavigationAction", "WKNavigationDelegate", "WKScriptMessage", "WKScriptMessageHandler",
    "WKUIDelegate", "WKUserContentController", "WKUserScript", "WKWebView", "WKWebViewConfiguration", "WKWindowFeatures",
] }
raw-window-handle = "0.6"

# Linux: the formatted composer is WebKitGTK 6.0 in a GTK 4 window (native
# on Wayland and X11), and HTML email is drawn by it off screen. Talked to
# directly (docs/gtk4-upgrade.md).
# Exact pins, as tested in trials/email-engines; move them up on purpose.
[target.'cfg(target_os = "linux")'.dependencies]
# webkit6 uses gtk::Accessible, which gtk4 only builds with GTK 4.10 support on.
gtk4 = { version = "=0.11.5", features = ["v4_10"] }
raw-window-handle = "0.6"
# Ask the compositor (over the main window's own connection) to let a new
# composer window come to the front (xdg-activation).
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
webkit6 = "=0.6.1"

[dev-dependencies]
egui_kittest = { version = "0.33", features = ["wgpu", "snapshot"] }
