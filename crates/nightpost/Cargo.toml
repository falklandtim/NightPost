[package]
name = "nightpost"
description = "NightPost: a fast, native email client written in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nightpost-core = { path = "../nightpost-core" }
anyhow.workspace = true
chrono.workspace = true
crossbeam-channel.workspace = true
log.workspace = true
serde_json.workspace = true
directories = "6"
eframe = { version = "0.33", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland", "x11"] }
# "http" + "image": load signature images from the web.
egui_extras = { version = "0.33", features = ["http", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"] }
env_logger = "0.11"
rfd = "0.15"
resvg = { version = "0.45", default-features = false }
ureq = "2.12"
base64 = "0.22"

# HTML email is shown in the system web view (WebKit). macOS first; Linux
# (WebKitGTK) to follow.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSGraphics", "NSMenu", "NSMenuItem", "NSResponder", "NSView", "NSWindow"] }
objc2-contacts = "0.3"
objc2-foundation = "0.3"
raw-window-handle = "0.6"
wry = "0.57"

# The formatted composer on Linux: WebKitGTK in a GTK window (native on
# Wayland and X11).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
javascriptcore-rs = "1.1"
raw-window-handle = "0.6"
# Ask the compositor (over the main window's own connection) to let a new
# composer window come to the front (xdg-activation).
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
webkit2gtk = "2.0"
wry = { version = "0.57", default-features = false, features = ["os-webview"] }

[dev-dependencies]
egui_kittest = { version = "0.33", features = ["wgpu", "snapshot"] }
