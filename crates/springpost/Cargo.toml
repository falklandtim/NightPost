[package]
name = "springpost"
description = "SpringPost: a fast, native email client written in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
springpost-core = { path = "../springpost-core" }
anyhow.workspace = true
chrono.workspace = true
crossbeam-channel.workspace = true
log.workspace = true
eframe = { version = "0.33", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland", "x11"] }
# "http" + "image": load signature images from the web.
egui_extras = { version = "0.33", features = ["http", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
env_logger = "0.11"

[dev-dependencies]
egui_kittest = { version = "0.33", features = ["wgpu", "snapshot"] }
