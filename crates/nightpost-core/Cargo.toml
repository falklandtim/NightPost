[package]
name = "nightpost-core"
description = "Mail sync engine, storage and models for NightPost"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
rusqlite = { version = "0.41", features = ["bundled"] }
imap = "2.4.1"
native-tls = "0.2"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "native-tls", "hostname"] }
mail-parser = "0.11"
html2text = "0.15"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
directories = "6"
ureq = "2.12"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
form_urlencoded = "1"
# Pictures in emails and attachments, sized down for the MCP server.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
